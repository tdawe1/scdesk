[workspace]
resolver = "2"
members = [
    "crates/sierra-paths",
    "crates/contracts",
    "crates/scid",
    "crates/journal-core",
    "crates/pulse-core",
    "apps/pulse/src-tauri",
    "apps/journal/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["scdesk"]

[workspace.dependencies]
sierra-paths = { path = "crates/sierra-paths" }
contracts = { path = "crates/contracts" }
scid = { path = "crates/scid" }
journal-core = { path = "crates/journal-core" }
pulse-core = { path = "crates/pulse-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
