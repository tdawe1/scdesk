# scdesk Pulse scoring.
# Day/Swing tables are the five quality pillars and must sum to 1.0
# (the engine renormalizes). Execution is a 10% overlay on top, not a sixth
# pillar in these tables.
#
# Quality is still mostly direction-agnostic. Bias is a separate signed reading.
# YES requires both a high composite and a non-NEUTRAL bias.

[day]
volatility = 0.30
momentum = 0.30
trend = 0.15
breadth = 0.15
macro = 0.10

[swing]
volatility = 0.25
momentum = 0.25
trend = 0.20
breadth = 0.20
macro = 0.10

[overlay]
execution = 0.10
