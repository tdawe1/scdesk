name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: crate tests
        run: cargo test --workspace --exclude scdesk-pulse --exclude scdesk-journal

  tauri-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: cargo check apps
        run: cargo check -p scdesk-pulse -p scdesk-journal

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/pulse/package-lock.json
            apps/journal/package-lock.json
      - name: pulse svelte-check
        working-directory: apps/pulse
        run: npm ci && npx svelte-check --threshold error
      - name: journal svelte-check
        working-directory: apps/journal
        run: npm ci && npx svelte-check --threshold error
